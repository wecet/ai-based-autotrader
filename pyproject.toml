[project]
name = "ai-trading-playground"
version = "0.1.0"
description = "A playground for experimenting with AI-powered trading strategies."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alpaca-py",
    "numpy",
    "dotenv",
    "pydantic",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1"
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
